async function go(n,note=''){

  }
  if(n===8)S.back=S.step;
  S.step=n;S.msg='';S.note=note;S.showA=false;window.scrollTo(0,0);
  if(n>=9&&n<=13)for(const k in S.tc)if(k[0]=='a')delete S.tc[k];

function refundInfo(b){const F=fare(b),hrs=(new Date(b.dep+'T'+b.flight.t)-Date.now())/36e5;
 if(DEAD.includes(b.status))return{can:false,why:b.status=='Cancelled'?'This booking has already been cancelled.':'A cancellation and refund has already been processed for this booking.'};
 if(hrs<=0)return{can:false,why:'This flight has already departed, so it can no longer be cancelled.'};
 if(b.status=='Pending')return{can:true,free:true,paid:0,refund:0,hrs};
 const ti=REFUND.findIndex(t=>hrs>=t.h),t=REFUND[ti];return{can:true,paid:F.tot,pct:t.p,ti,refund:Math.round(F.tot*t.p*100)/100,hrs}}

async function doCancel(){
  const b=(S.mine||[]).find(x=>x.ref==S.cb);if(!b)return;
  if(!S.cok){S.cmsg='Please tick the box to confirm the cancellation.';return render()}
  if(b.payment_status=='PAID'){const {data:rr,error:re}=await DB.rpc('request_refund',{p_reference:b.ref,p_reason:'Customer requested cancellation and refund'});
   if(re){S.cmsg=re.message||'Unable to send the refund request.';return render()}
   b.status='Refund Pending';S.cdone=`Your refund request for ${b.ref}${b.pax>1?' ('+b.pax+' passengers: '+b.P.map(q=>q.name).join(', ')+')':''} was sent to our staff. All boarding passes on this booking will be cancelled. Refund amount: ${peso((rr&&rr.amount)||0)}. Staff will release it to your original payment method once approved.`;S.cmsg='';S.cok=false;return render()}
  if(b.status!='Pending'){S.cmsg='This booking cannot be cancelled online. Please contact the ticketing counter.';return render()}
  const {data,error}=await DB.rpc('cancel_my_booking',{p_reference:b.ref});
  if(error||!data){console.error(error);S.cmsg='Unable to cancel this booking. Please contact the ticketing counter.';return render()}
  b.status='Cancelled';S.cdone=`Reservation ${b.ref}${b.pax>1?' ('+b.pax+' passengers)':''} has been cancelled. No payment was made, so nothing is owed.`;
  S.cmsg='';S.cok=false;render()
}

function toBk(b,fm){const seats=String(b.seat_number||'').split(',').map(x=>x.trim()).filter(Boolean);const contactParts=SkyPathPhone.parseStored(b.contact_number||'');let st=ST[b.status]||b.status;if(st=='Pending'&&b.payment_status=='PAID')st='Paid';if(b.payment_status=='REFUNDED')st='Refunded';else if(b.status=='CANCELLED'&&b.payment_status=='PAID')st='Refund Pending';
 const PS=Array.isArray(b.passengers)&&b.passengers.length?b.passengers.map(q=>({name:q.name,gender:q.gender||'Female',dob:q.dob||'',disc:q.disc||'none',bag:Math.min(Math.max(0,Number(q.bag)||0),BAG.length-1),meal:MEALS[q.meal]!=null?q.meal:'Standard'})):[[{name:b.passenger_name,gender:b.gender||'Female',dob:b.birthdate||'',disc:'none',bag:Math.max(0,BAG.findIndex(x=>x.p==Number(b.baggage_allowance||0))),meal:'Standard'}]];
 return{id:b.id,ref:b.booking_reference,o:fm.origin,d:fm.destination,dep:b.departure_date,pax:PS.length,flight:fm,seats,seatText:seats.length>1?seats.join(', '):'',created:b.created_at||'',
  P:PS,C:{phone:contactParts.national||'',countryCode:contactParts.code||'+63',email:b.contact_email||''},contact_number:b.contact_number||'',status:st,total:Number(b.total_amount||0),total_amount:Number(b.total_amount||0),payment_status:b.payment_status}}

 const {data,error}=await DB.from('bookings').select('*').eq('user_id',S.user.id);

 const ids=[...new Set((data||[]).map(b=>b.flight_id))],fm={};

 S.mine=(data||[]).filter(b=>fm[b.flight_id]).map(b=>{const k=toBk(b,fm[b.flight_id]);if(openR.has(b.id)&&k.status!='Refunded')k.status='Refund Pending';return k}).sort((a,b)=>String(b.created).localeCompare(String(a.created))||String(b.dep).localeCompare(String(a.dep)))}

async function checkCustomerRole(u){
 const {data:pr,error}=await DB.from('profiles').select('role').eq('id',u.id).maybeSingle();
 if(error)return {allowed:false,reason:'We could not verify your account permissions. Check your connection and try again.',retryable:true};
 if(pr&&String(pr.role||'').toLowerCase()==='customer')return {allowed:true};
 return {allowed:false,reason:'This account belongs to the SkyPath staff portal. Please sign in through the staff login page.',forbidden:true};
}
async function isCustomer(u){
 const access=await checkCustomerRole(u);
 if(access.forbidden){try{await DB.auth.signOut()}catch(e){}S.user=null;}
 if(!access.allowed&&access.retryable)S.msg=access.reason;
 return access.allowed;
}
async function ensureCustomerSession(){
 if(!HAS_SB)return {allowed:false,reason:'Supabase is not configured. Please try again after reconnecting the project.'};
 let user=null;
 try{const {data,error}=await DB.auth.getUser();if(!error)user=data?.user||null;}catch(e){console.error('Unable to validate customer session:',e)}
 if(!user){S.user=null;return {allowed:false,reason:'Your session is missing or expired. Please log in to continue.'};}
 const access=await checkCustomerRole(user);
 if(!access.allowed){S.user=null;if(access.forbidden){try{await DB.auth.signOut()}catch(e){}}return access;}
 S.user=user;
 return {allowed:true,user};
}

async function doReset(){if(S.busy||needCfg())return;if(authBad(['np','np2']))return render();S.busy=true;S.msg='';render();
 const {error}=await DB.auth.updateUser({password:S.au.np});S.busy=false;
 if(error){S.msg=error.message;return render()}
 const {data}=await DB.auth.getUser();S.user=data.user;await afterLogin()}
async function logout(){await DB.auth.signOut();S.user=null;S.mine=[];reset()}
function myBookings(){const L=S.mine||[];return `<main><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:6px"><h3 class="f" style="margin:0">My Bookings</h3><div style="display:flex;gap:10px"><button class="btn or sm" onclick="go(1)">Book a Flight</button><button class="btn gh sm" onclick="logout()">Log Out</button></div></div>${S.msg?`<div class="em" style="font-size:17px">${S.msg}</div>`:''}
 ${L.length?L.map(b=>`<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center"><div><div class="f" style="font-size:24px;font-weight:700">${b.ref}</div><div style="color:var(--mute)">${b.flight.no} · ${CITY(b.o)} (${b.o}) → ${CITY(b.d)} (${b.d}) · ${fd(b.dep)} · ${t12(b.flight.t)}</div><div style="color:var(--mute)">Seats: ${b.seats.join(', ')||'—'} · ${peso(b.total)}</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="st ${b.status.replace(' ','')}">${b.status.toUpperCase()}</span>${b.status=='Confirmed'?`<button class="btn cy sm" onclick="viewR('${b.ref}')">View Receipt</button>`:b.status=='Pending'?`<button class="btn or sm" onclick="S.pay=newPay('${b.ref}');go(15)">Pay Now</button>`:b.status=='Paid'?'<span style="color:var(--mute);font-size:15px">Payment received · awaiting staff confirmation</span>':''}${DEAD.includes(b.status)?'':`<button class="btn gh sm" onclick="S.cb='${b.ref}';S.cok=false;S.cmsg='';go(8)">Cancel / Refund</button>`}</div></div></div>`).join(''):'<p style="color:var(--mute);font-size:19px">You have no bookings yet.</p>'}</div></main>`}

/* ===== Online payment (DEMO: no real money moves) ===== */
const newPay=ref=>({ref,method:'',phone:'',card:'',exp:'',cvc:'',cname:'',phase:'choose',otp:'',show:false,payRef:''});
const PM={gcash:['GCash','E-wallet'],maya:['Maya','E-wallet'],card:['Card','Credit / Debit']};
const PE={phone:v=>/^09\d{9}$/.test(v.replace(/[\s-]/g,'').replace(/^\+63/,'0'))?'':'Enter your 11-digit mobile number (09XXXXXXXXX).',
 card:v=>/^\d{16}$/.test(v.replace(/[\s-]/g,''))?'':'Enter a 16-digit card number.',
 exp:v=>{const m=v.trim().match(/^(0[1-9]|1[0-2])\/(\d{2})$/);if(!m)return'Enter a valid expiry (MM/YY).';const d=new Date();return (2000+ +m[2])*12+ +m[1]>=d.getFullYear()*12+d.getMonth()+1?'':'This card has expired.'},
 cvc:v=>/^\d{3,4}$/.test(v.trim())?'':'Enter the 3 or 4 digit security code.',
 cname:v=>v.trim().split(/\s+/).filter(Boolean).length<2?'Enter the name on the card.':''};
const pfields=()=>S.pay.method=='card'?['card','exp','cvc','cname']:S.pay.method?['phone']:[];
function pchk(k){S.tc['p_'+k]=1;const e=PE[k](S.pay[k]),i=$('pi_'+k),m=$('pem_'+k);if(i)i.classList.toggle('er',!!e);if(m)m.textContent=e}
const pf=(k,l,ph,max,mode)=>{const v=S.pay[k],em=(S.pay.show||S.tc['p_'+k]||String(v).trim()!=='')?PE[k](v):'';return `<div class="fld"><span class="lbl">${l}</span><input id="pi_${k}" class="inp ${em?'er':''}" value="${esc(v)}" placeholder="${ph}" maxlength="${max}" inputmode="${mode||'text'}" autocomplete="off" oninput="S.pay.${k}=this.value;pchk('${k}')" onblur="pchk('${k}')"><div class="em" id="pem_${k}">${em}</div></div>`};
function payBk(){const r=S.pay&&S.pay.ref;return (S.mine||[]).find(x=>x.ref==r)||(S.localBooking&&S.localBooking.ref==r?S.localBooking:null)}
function payNext(){const p=S.pay;if(!p.method){S.msg='Choose a payment method.';return render()}p.show=true;if(pfields().some(k=>PE[k](p[k])))return render();p.phase='otp';p.otp='';S.msg='';render()}
async function payConfirm(){const p=S.pay,b=payBk();if(!b||S.busy)return;
 if(!/^\d{6}$/.test(p.otp)){S.msg='Enter the 6-digit code.';return render()}
 if(p.otp!=='123456'){S.msg='Incorrect code. (Demo code: 123456)';return render()}
 S.busy=true;S.msg='';render();
 const {data,error}=await DB.rpc('demo_pay_booking',{p_reference:b.ref,p_method:p.method});S.busy=false;
 if(error||!data||!data.ok){console.error(error);S.msg=error&&error.message&&error.message.length<90?error.message:'Payment could not be completed. Please try again or pay at the counter.';return render()}
 p.phase='done';p.payRef=data.payment_ref;await loadMine();render()}
function payPg(){const p=S.pay,b=payBk();
 if(!p||!b)return wrap(`<h3 class="f">Online Payment</h3><p style="color:var(--mute)">We couldn't find that booking.</p><button class="btn cy" onclick="go(14)">My Bookings</button>`);
 const sumry=`<div class="rc" style="margin-bottom:14px"><div><b>Booking:</b> ${b.ref}</div><div><b>Flight:</b> ${b.flight.no} · ${b.o} → ${b.d} · ${fd(b.dep)}</div></div><div class="tot" style="margin:0 0 20px"><span>Amount to pay</span><b>${peso(b.total)}</b></div>`;
 const demo='<div class="banner g" style="margin:0 0 18px">DEMO MODE: no real money is charged. Use any details. The one-time code is 123456.</div>';
 const err=S.msg?`<div class="em" style="font-size:17px;margin-bottom:12px">${S.msg}</div>`:'';
 if(p.phase=='done')return wrap(`<div class="done"><div class="ring">${I.chk.replace('#fff','currentColor').replace('width="16" height="16"','width="60" height="60"')}</div><span class="pend">PAYMENT RECEIVED (DEMO)</span><h2 class="f" style="font-size:36px">Thank you!</h2><p style="color:var(--mute);font-size:19px">Reference ${b.ref} · ${peso(b.total)} via ${PM[p.method][0]}<br>Payment ref ${esc(p.payRef)}</p><div class="note">${I.inf}<div><h4>Staff have been notified</h4><p>Our staff and admin team received your payment notification. Once they confirm it, your receipt will be ready in My Bookings.</p></div></div><div class="eb"><button class="btn cy" onclick="go(14)">My Bookings</button><button class="btn gh" onclick="reset2()">Home</button></div></div>`);
 if(b.status!='Pending')return wrap(`<h3 class="f">Online Payment</h3><p style="color:var(--mute);font-size:19px">${b.status=='Paid'?'This booking is already paid and is waiting for staff confirmation.':'This booking cannot be paid online.'}</p><button class="btn cy" onclick="go(14)">My Bookings</button>`);
 if(p.phase=='otp'){const w=p.method!='card';return wrap(`<h3 class="f" style="font-size:28px">Authenticate Payment</h3>${demo}${sumry}<p style="font-size:18px;color:var(--mute)">${w?`Approve this payment in your ${PM[p.method][0]} app. Enter the 6-digit one-time code sent to <b style="color:var(--ink)">${esc(p.phone)}</b>.`:'Your bank sent a 6-digit one-time code to confirm this card payment (3-D Secure).'}</p><div class="fld"><span class="lbl">One-Time Code</span><input class="inp" inputmode="numeric" maxlength="6" placeholder="123456" value="${esc(p.otp)}" oninput="S.pay.otp=this.value" onkeydown="if(event.key==='Enter')payConfirm()"></div>${err}<div class="acts"><button class="btn gh" onclick="S.pay.phase='choose';S.msg='';render()">Back</button><button class="btn or" onclick="payConfirm()">${S.busy?'Processing…':'Pay '+peso(b.total)}</button></div>`)}
 const fields=p.method=='card'?pf('card','Card Number','4242 4242 4242 4242',19,'numeric')+`<div class="g2">${pf('exp','Expiry (MM/YY)','12/29',5)}${pf('cvc','Security Code','123',4,'numeric')}</div>`+pf('cname','Name on Card','Maria Santos',40):p.method?pf('phone',PM[p.method][0]+' Mobile Number','09171234567',13,'tel'):'';
 return wrap(`<h3 class="f" style="font-size:28px">Pay Online</h3>${demo}${sumry}<span class="lbl">Payment Method</span><div class="bag" style="margin-bottom:18px">${Object.keys(PM).map(m=>`<button class="op ${p.method==m?'on':''}" onclick="S.pay.method='${m}';S.pay.show=false;S.msg='';render()"><b>${PM[m][0]}</b><span>${PM[m][1]}</span></button>`).join('')}</div>${fields}${err}<div class="acts"><button class="btn gh" onclick="go(14)">Pay Later</button><button class="btn or" onclick="payNext()">Continue</button></div>`)}
function render(){const v=[landing,search,select,seats,pass,summary,done,receipt,cancelPg,loginPg,registerPg,verifyPg,forgotPg,resetPg,myBookings,payPg][S.step]();$('app').innerHTML=(HAS_SB?'':'<div style="background:#f97316;color:#fff;padding:12px 24px;text-align:center;font-weight:700">Supabase is not connected, so nothing can be loaded or saved yet. Paste your Project URL and anon key at the top of this file (SB_URL and SB_KEY) and check your internet connection.</div>')+(S.step==0?'':header())+v}
if(HAS_SB){
 DB.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT'){
   S.user=null;S.mine=[];
   if(CUSTOMER_PROTECTED_STEPS.has(S.step)){S.after=S.step;S.step=9;S.msg='';S.note='Your session ended. Please log in again to continue.';render();}
   else if(S.step===0)render();
  }
 });
 (async()=>{
  try{
   const {data,error}=await DB.auth.getUser();
   if(!error&&data?.user&&await isCustomer(data.user))S.user=data.user;
  }catch(e){console.error('Unable to restore SkyPath customer session:',e)}
  if(S.step===0)render();
 })();
}
try{render()}catch(e){console.error(e);document.getElementById('app').innerHTML='<pre style="padding:24px;white-space:pre-wrap">SkyPath failed to start:\n'+e+'</pre>'}

</script></body></html>
